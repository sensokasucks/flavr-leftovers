# Fridge Chat Credits
# Copy to config.yaml and turn on the platforms you use.

app:
  host: "127.0.0.1"
  port: 3854
  log_level: "INFO"
  session_file: "data/session.json"
  save_every_sec: 10

roster:
  ignore_own_channel: true
  min_message_length: 1
  ignore_usernames:
    - nightbot
    - streamelements
    - streamlabs
    - moobot
    - fossabot
    - wizebot
    - sery_bot
    - commanderroot
    - soundalerts

# Anonymous IRC — no Twitch token needed
twitch:
  enabled: false
  channel: "your_twitch_channel"     # twitch.tv/THIS_PART

# Public Pusher listen — same method as Stream Core
kick:
  enabled: false
  channel_slug: "YOUR_KICK_CHANNEL"  # kick.com/THIS_PART
  # If Kick 403s the lookup, set chatroom.id from:
  # https://kick.com/api/v2/channels/YOUR_KICK_CHANNEL
  # chatroom_id: 12345678

# Needs a YouTube Data API v3 key + the live VOD/video id
youtube:
  enabled: false
  api_key: ""
  video_id: ""
  # live_chat_id: ""                 # optional override

# Reuse Stream Core chat instead of opening a second Kick socket
ingest:
  stream_core:
    enabled: false
    ws_url: "ws://127.0.0.1:3850/ws"

# Visual defaults for the credits overlay (also editable from the control page)
credits:
  title: "Thanks for watching"
  subtitle: ""
  footer: "See you next stream"
  section_label: "Chatters"
  group_by_platform: false
  sort: "first_seen"                 # first_seen | last_seen | name | messages
  columns: 2
  speed_px_per_sec: 42
  gap_after_loop_sec: 2.5
  mode: "loop"                       # loop | once | hold
  show_platform: true
  show_message_count: false
  highlight_mods: true
  font_family: '"Palatino Linotype", Palatino, "Times New Roman", Georgia, serif'
  title_size_px: 54
  name_size_px: 22
  title_color: "#f3e2b0"
  name_color: "#f4f0e6"
  muted_color: "#9a8f78"
  mod_color: "#e8c36a"
  background: "transparent"
  text_shadow: "0 2px 8px rgba(0,0,0,0.85)"
  letter_spacing_em: 0.04
  column_gap_px: 48
  row_gap_px: 10
  max_width_px: 920
  custom_font_url: ""                # optional @font-face URL
