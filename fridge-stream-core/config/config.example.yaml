# Fridge Stream Core configuration
# Copy to config.yaml and edit.
# All chat platforms default OFF — enable only what you use.

core:
  host: "127.0.0.1"
  port: 3850
  command_prefix: "!"
  log_level: "INFO"

kick:
  enabled: false
  channel_slug: "YOUR_KICK_CHANNEL"
  poll_viewer_interval_sec: 15

twitch:
  enabled: false
  channel: "YOUR_TWITCH_CHANNEL"

youtube:
  enabled: false
  mode: "innertube"
  api_key: ""
  channel_id: ""
  video_id: ""

minecraft:
  enabled: false
  player_name: "YourInGameName"
  client_mod_url: "http://127.0.0.1:3852"
  server_mod_url: "http://127.0.0.1:3853"

permissions:
  admin:
    - "YOUR_USERNAME"
  mod: []

metrics:
  messageWindowSec: 60
  commandWindowSec: 120
  viewerWeight: 0.4
  cpmWeight: 0.3
  commandWeight: 0.3
  maxViewersForFull: 500
  maxCpmForFull: 30
  maxCommandsForFull: 10

overlay:
  show_inventory_seconds: 12
  alert_duration_ms: 6000

chat_log:
  enabled: false

points:
  enabled: false
  per_message: 1
  cooldown_sec: 30
  admin_token: "change-me"

command_groups:
  core:
    enabled: true
    always: true
    description: "Built-in Core commands"
  minecraft:
    enabled: true
    bind: "minecraft"
    description: "Minecraft integration commands"
  points:
    enabled: true
    bind: "points"
    description: "Chat points commands"
