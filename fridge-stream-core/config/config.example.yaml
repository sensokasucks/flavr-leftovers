# Fridge Stream Core configuration
# Copy to config.yaml and edit.
# All chat platforms default OFF — enable only what you use.

core:
  host: "127.0.0.1"
  port: 3850                  # same port the old Minecraft bridge used
  command_prefix: "!"
  log_level: "INFO"
  # Notice edits to this file while Core runs and reconnect only the chat
  # platforms whose settings changed. Set false to apply only from the admin page.
  watch_config: true
  # Requests from other web sites are refused (CSRF / DNS-rebinding guard).
  # Only needed if you deliberately serve Core on a LAN name or IP:
  # allowed_hosts: ["192.168.1.20"]
  # allowed_origins: ["http://192.168.1.20:3850"]

# --- Chat platforms (all opt-in) -----------------------------------------

kick:
  enabled: false
  channel_slug: "YOUR_KICK_CHANNEL"   # kick.com/THIS_PART only
  # chatroom_id is auto-detected on first successful lookup and saved here.
  # Only set it by hand if autodetection fails (Cloudflare 403):
  # 1. Open https://kick.com/api/v2/channels/YOUR_SLUG in a browser
  # 2. Find "chatroom": { "id": 12345678, ... }
  # 3. Uncomment and set:
  # chatroom_id: 12345678
  # channel_id: 1234567          # optional; the top-level "id" from the same page. Hosts and Kicks
  #                                # use it. Core learns it from the viewer-count lookup if unset.
  poll_viewer_interval_sec: 15
  avatars: true                    # chatter profile pictures (one lookup per chatter, cached)

twitch:
  enabled: false
  channel: "YOUR_TWITCH_CHANNEL"   # twitch.tv/THIS_PART (no #)
  # Chat is read over anonymous IRC; no login needed to listen.
  third_party_emotes: true        # BetterTTV / FrankerFaceZ / 7TV emotes (public APIs, no keys)
  avatars: true                   # chatter pictures; needs "Connect Twitch" in the dashboard (token in data/)
  client_id: ""                   # Advanced: your own Twitch app. Empty = Stream Core's built-in public app
  client_secret: ""               # only for a "Confidential" app of your own; never commit it

youtube:
  enabled: false
  # mode:
  #   innertube  – no API key, no quota (uses the same web endpoint as youtube.com)
  #   official   – Data API v3 (needs api_key + uses daily quota)
  #   auto       – official if api_key is set, otherwise innertube
  mode: "innertube"
  api_key: ""                    # only for mode: official
  channel_id: ""                 # optional helper
  video_id: ""                   # current live video id (required for innertube; recommended for official)
  # live_chat_id: ""             # optional override for official mode

# --- Games ---------------------------------------------------------------

minecraft:
  enabled: false             # opt-in: set true when the Fabric mods are running
  player_name: "YourInGameName"
  client_mod_url: "http://127.0.0.1:3852"
  server_mod_url: "http://127.0.0.1:3853"
  market:
    dynamo_symbols: ["MINECRAF"]
    dynamo_min_factor: 0.25
    dynamo_max_factor: 3.0
    vault_symbol: "MINECRAF"
    vault_rf_per_point: 200
    vault_min_rf: 1000
    chest_symbol: "MINECRAF"
    chest_points_per_xp: 1.0
    chest_min_xp: 1.0
    chest_default_value: 0.05
    chest_use_smelt_xp: true
    chest_item_values:
      minecraft:diamond: 2.0
      minecraft:raw_iron: 0.7
      minecraft:cobblestone: 0.05
      minecraft:dirt: 0.02

factorio:
  enabled: false             # opt-in: set true when Fridge Factorio Stats is running
  bridge_url: "http://127.0.0.1:3847"
  market:
    dynamo_symbols: ["FACTORIO"]
    dynamo_min_factor: 0.25
    dynamo_max_factor: 3.0
    vault_symbol: "FACTORIO"
    chest_symbol: "FACTORIO"
    vault_flush_mj: 25
    chest_flush_items: 20

openttd:
  enabled: false             # opt-in: Admin Port on the OpenTTD / JGRPP server
  host: "127.0.0.1"
  admin_port: 3977
  admin_password: ""         # must match network.admin_password
  name: "FridgeStreamCore"
  pounds_per_point: 1000
  min_invest_points: 10
  max_invest_points: 5000
  use_gamescript: true       # FridgeChatFund injects cash
  allow_host_invest: true

permissions:
  # Case-insensitive. Plain names match Kick + Twitch logins only.
  # Scope to one platform with "kick:name" / "twitch:name".
  # YouTube needs the channel id ("youtube:UCxxxx") — YouTube names are
  # display names anyone can copy, so plain names never apply there.
  admin:
    - "YOUR_USERNAME"
  mod: []

metrics:
  messageWindowSec: 60
  commandWindowSec: 120
  viewerWeight: 0.4
  cpmWeight: 0.3
  commandWeight: 0.3
  maxViewersForFull: 500
  maxCpmForFull: 30
  maxCommandsForFull: 10

overlay:
  show_inventory_seconds: 12
  alert_duration_ms: 6000   # how long each alert stays on the overlay
  # Stats overlay widgets. Uncheck in Admin → Config → Overlay, or use
  # ?show=health,power / ?hide=food,armor on the Webpage source URL.
  modules:
    health: true
    food: true
    xp: true
    deaths: true
    armor: true
    viewers: true
    cpm: true
    power: true
    effects: true
    inventory: true

# In-house chat points (SQLite in data/stream_core.db). Off by default.
points:
  enabled: false
  per_message: 1          # points awarded per message
  cooldown_sec: 30        # anti-spam: min seconds between awards per user
  sub_points: 500         # new sub or resub (Twitch / YouTube member / Kick)
  follow_points: 250      # first follow only (unfollow + refollow pays nothing)
  gift_points: 1000       # to the gifter, for each sub they gift
  # Header X-Admin-Token for /admin. "change-me" is NOT accepted: leave it and
  # Core generates a random token in data/admin_token.txt (printed at startup).
  admin_token: "change-me"

# Persist every chat message for the admin Chat History tab / CSV export.
# Off by default — the live overlay still works without this.
chat_log:
  enabled: false

# Fridge Market tape (overlays work in preview even while enabled is false).
# Trading commands are not shipped yet — see docs/MARKET.md.
market:
  enabled: false
  tick_sec: 5
  death_return: -0.08
  death_cooldown_sec: 20      # 0 = no cooldown (spawn camp can dump the ticker)
  signal_cooldown_sec: 15     # default for other game.signal names; 0 = off
  signal_cooldown_scope: symbol   # symbol | book | global
  hourly_cap_points: 500
  dividend_price_bump: 0.01
  steam_poll_sec: 1800          # Steam CCU refresh; 1800 = 30 minutes
  chatter_points_scale: 10.0    # channel points / scale = listing price
  chatter_streak_bonus: 0.05    # +5% per consecutive stream they chat in
  points_per_unit:
    mj: 0.02
    rf: 0.005
    xp: 1.0
    items: 1.0

# Unique-chatter end credits overlay. Off by default.
# Uses the same Kick / Twitch / YouTube adapters as live chat — no extra process.
# Overlay: http://127.0.0.1:3850/overlay/credits.html
# Admin → Credits tab to enable, restyle, and roll.
credits:
  enabled: false
  ignore_own_channel: true
  min_message_length: 1
  title: "Thanks for watching"
  subtitle: ""
  footer: "See you next stream"
  section_label: "Chatters"
  group_by_platform: false
  sort: "first_seen"            # first_seen | name | messages | last_seen
  columns: 2
  speed_px_per_sec: 42
  gap_after_loop_sec: 2.5
  mode: "loop"                  # loop | once | hold | clear (play once, then leave the screen empty)
  motion: "crawl"               # crawl | crawl-down | starwars | cards | fade | slides | ticker | typewriter | matrix
  show_platform: true
  highlight_mods: true
  background: "transparent"
  # typewriter_unit: "line"     # line | card | page | name (name = whole names every type_ms)
  # typewriter_cps: 28          # characters per second
  # matrix_density: 1.0         # 0.4 – 2.2
  # letterbox: false
  # grain: false
  # clear_when_done: false      # Play once ends on an empty screen
  # title_own_page: true        # page motions: title on its own page
  # ignore_usernames: [nightbot, streamelements]   # replaces the built-in bot list

# Command groups. Toggle in Admin → Config without restarting Core.
# bind: minecraft → on only when minecraft.enabled AND the integration is running
# bind: points    → on only when points.enabled
# always: true    → cannot be disabled (core)
command_groups:
  core:
    enabled: true
    always: true
    description: "Built-in Core commands (!help, !permit)"
  points:
    enabled: true
    bind: points
    description: "Chat points (!points / !balance)"
  minecraft:
    enabled: true
    bind: minecraft
    description: "Minecraft integration (!spawn, !give, …)"
  factorio:
    enabled: true
    bind: factorio
    description: "Factorio stats overlay (Fridge Factorio Stats bridge)"
  openttd:
    enabled: true
    bind: openttd
    description: "OpenTTD Admin Port + Chat Fund (!invest, !companies)"
  credits:
    enabled: true
    bind: credits
    description: "End credits (!credit / !credits)"
  market:
    enabled: true
    bind: market
    description: "Fridge Market (!buy / !sell / !tickers)"
  reactions:
    enabled: true
    bind: reactions
    description: "Chat reactions (emoji / !tomato → Stream Rooms or fallback overlay)"
  chat_games:
    enabled: true
    bind: chat_games
    description: "Chat games + crowd moments (combos, hype, polls, predictions, slots, heists …)"

# Chat reactions: emoji / emotes / commands that play effects in Stream Rooms
# (or on /overlay/reactions.html when the game isn't connected).
# Easiest to edit in Admin → Config → Reactions (saves here, no restart).
# Costs use the Core points ledger, so points.enabled must be true for any
# entry with cost > 0.
reactions:
  enabled: false
  send_to: auto            # auto | game | overlay
  targeting: opt_out       # opt_out (!nothrow) | opt_in (!throwok needed)
  opt_out_command: nothrow
  opt_in_command: throwok
  targets_command: targets
  admins_free: true
  refund_if_dropped: true
  chat_replies: true
  say_per_minute: 6        # chat lines the game may post through Core
  entries:
    - id: tomato
      label: Tomato
      emoji: ["🍅"]
      commands: [tomato]    # !tomato @bob   /   !tomato screen
      effect: throw
      params: {object: "🍅", impact: splat, stick_sec: 6}
      targets: [stage, user, guest]
      default_target: stage
      permission: public    # public | mod | admin
      require: []           # [sub] / [vip] / [sub, vip]
      cost: 0
      cooldown_user_sec: 5
      cooldown_global_sec: 0
      cooldown_target_sec: 8
      max_per_message: 3    # 🍅🍅🍅 / !tomato x3 fire up to this many
      command_count: 1      # how many a plain !tomato fires
    - id: boot
      label: Boot
      emoji: ["🥾"]
      commands: [boot]
      effect: throw
      params: {object: "img:boot", impact: bounce, stick_sec: 3}   # img:<name> = a picture from Admin → Reactions → Pictures
      targets: [stage, user, guest]
      default_target: stage
      permission: public
      cooldown_user_sec: 20
      cooldown_global_sec: 2
      cooldown_target_sec: 15
      max_per_message: 3
    - id: confetti
      label: Confetti
      emoji: ["🎉"]
      commands: [confetti]
      effect: confetti
      params: {count: 80}
      targets: [stage]
      default_target: stage
      cost: 25
      cooldown_user_sec: 30
      cooldown_global_sec: 10
      reply_ok: "@{user} 🎉 ({cost} pts)"
    # sign / sleep / snack / phone / highfive and the Kick emotes FLASHBANG, POLICE,
    # ThisIsFine, DonoWall are added automatically (reactions.seeded_defaults).

# Chat games + crowd moments (Admin → Chat games; docs/CHAT_GAMES.md). Off by default.
# Everything below is optional: leave a key out and the default is used. Games that use
# points (predict, duel, slots, heist, claim, request bumps, front-row seats) need points.enabled.
chat_games:
  enabled: false
  replies: true             # answers show on the reply screen / replies overlay
  combos:                   # 3+ people using emotes of one mood within 10 s -> the room reacts
    enabled: true
    min_people: 3
    window_sec: 10
  hype:                     # different people chatting in the last minute; levels set off crowd moments
    enabled: true
    levels: [5, 10, 20]
  tug: {enabled: true, cheer_command: cheer, boo_command: boo, round_sec: 30}
  launch: {enabled: true, command: launch, people: 5, window_sec: 60, cooldown_sec: 600}
  claim: {enabled: true, command: claim, points: 50}
  streak:
    enabled: true
    gap_hours: 4            # chat quiet this long = the next stream
    titles:
      - {streams: 5, title: Regular}
      - {streams: 10, title: Die-hard}
      - {streams: 25, title: Legend}
  seat: {enabled: true, command: seat, front_cost: 50, swap_command: swap}
  predict: {enabled: true, command: predict, min_bet: 1, max_bet: 10000}
  duel: {enabled: true, command: duel, min_bet: 10, max_bet: 1000}
  slots: {enabled: true, command: slots, min_bet: 5, max_bet: 200, cooldown_sec: 30}
  heist: {enabled: true, command: heist, join_command: join, join_sec: 60, cooldown_sec: 600}
  trivia: {enabled: true, points: 100, time_sec: 45, auto_every_min: 0}   # questions: config/trivia.json
  poll: {enabled: true, command: poll, max_options: 5}
  rate: {enabled: true, command: rate, window_sec: 120}
  request: {enabled: true, command: request, bump_cost: 100, max_per_user: 2}
  moment: {enabled: true, commands: [clip, moment]}
