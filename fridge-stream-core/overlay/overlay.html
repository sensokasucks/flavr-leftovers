<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stream Stats</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div id="root">
    <div class="row">
      <div class="stat" id="hp-wrap"><span class="label">HP</span><span id="hp">--</span></div>
      <div class="stat"><span class="label">CPM</span><span id="cpm">0</span></div>
      <div class="stat"><span class="label">Viewers</span><span id="viewers">0</span></div>
      <div class="stat"><span class="label">Power</span><span id="power">0</span></div>
    </div>
    <div id="inventory" class="inventory hidden"></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
