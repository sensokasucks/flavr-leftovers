<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stream Alerts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="alerts.css" />
  <link rel="stylesheet" id="alerts-custom-css" href="alerts-custom.css" />
</head>
<body class="skin-classic">
  <!--
    DOM matches Streamlabs Alert Box + StreamElements AlertBox so existing
    overlay CSS can target the same ids/classes. See ALERTS.md.
  -->
  <div id="wrap" class="widget-AlertBox">
    <div id="idle-hint">Waiting for an alert</div>
    <div id="alert-box" class="alert-box hidden" aria-live="polite">
      <div id="alert-image-wrap" class="alert-image">
        <video id="alert-video" autoplay muted playsinline loop></video>
        <img id="alert-image" alt="" />
        <div class="alert-icon" aria-hidden="true"></div>
      </div>
      <div id="alert-text-wrap" class="alertbox-message">
        <div class="alert-kind" id="alert-kind"></div>
        <div id="alert-message" class="alertbox-message-text alert-text"></div>
        <div id="alert-user-message" class="alertbox-message-message alert-message"></div>
        <div class="alert-meta" id="alert-meta"></div>
      </div>
    </div>
  </div>
  <script src="alerts.js"></script>
</body>
</html>
