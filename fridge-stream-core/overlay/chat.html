<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat Overlay</title>
  <link rel="stylesheet" href="animate-lite.css" />
  <link rel="stylesheet" href="chat.css" />
  <link rel="stylesheet" id="chat-custom-css" href="chat-custom.css" />
</head>
<body class="skin-classic">
  <!--
    DOM matches the Streamlabs Chat Box (and StreamElements chat) layout so CSS written for
    those widgets drops in: #log > div[data-from][data-id] > .meta (.badges .badge, .name, .colon)
    + .message (.emote). Each part also carries the StreamElements names (.message-row,
    .user-box, .user-name, .user-message) and the jChat ones (#chat_container, .chat_line,
    .user_info, .nick), so templates from all three families find their selectors.
  -->
  <div id="chat-root" class="widget-ChatBox">
    <div id="chat_container">
      <div id="log" class="sl__chat__layout messages"></div>
    </div>
  </div>
  <script src="overlay-hint.js"></script>
  <script src="chat.js"></script>
</body>
</html>
